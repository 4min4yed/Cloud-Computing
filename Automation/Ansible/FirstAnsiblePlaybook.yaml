---
- name: Enable internet services
  hosts: serverb.lab.example.com
  become: true
  tasks:
    - name: install latest
      ansible.builtin.dnf:
        name:
          - firewalld
          - httpd
          - mariadb-server
          - php
          - php-mysqlnd
        state: latest
    - name: firewall configuration
      ansible.builtin.service:
        name: firewalld
        enabled: true
        state: started
    - name: firewalld permits http service
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true
    - name: ensure mariadb runnning
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
    - name: ensure httpd running
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: true
    - name: copy files
      ansible.builtins.copy:
        src: index.php
        dest: /var/www/html/index.php
        mode: 0644
- name: on the control node
  hosts: workstation
  become: false
  tasks:
    - name: Test access to http server from control node
      ansible.builtin.uri:
        url: http://serverb.lab.example.com
        status_code: 200

...